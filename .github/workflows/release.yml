# Build Chordsmith for MPC OS and attach the zip to a DRAFT release, with mpc-vst-plugins' reusable workflow
# (its docs/RELEASING.md, "Releasing from CI"). mpc-vst-plugins is pinned to ONE commit in both places below.
#
# Until sd88me/mpc-vst-plugins#90 is merged, upstream lacks the wrapper and skin changes this port relies on
# (Q-Link tick counting, tiles lit from MIDI, 47-character readouts, theme_tile_on, order=pads, scale_names,
# the browser tile), so both pins name that PR's head: the workflow from the fork, and tools_ref, which the
# workflow checks out from upstream (a PR's commits are fetchable there). Point both at upstream once it is in.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version for the zip and INSTALL.md, e.g. 0.3.0
        required: true
        type: string
      dry_run:
        description: Build and package only (zip and skin previews as run artifacts, no draft release)
        type: boolean
        default: false

jobs:
  vst:
    uses: jacob-sabella/mpc-vst-plugins/.github/workflows/vst-release.yml@6541253077778018d540c72dfe683576798ae0f1
    permissions: { contents: write }
    with:
      tag: chordsmith-vst-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: 6541253077778018d540c72dfe683576798ae0f1
      vst_dir: vst
      build: vst/build.sh
      host_test: vst/test.sh
      about: "Chord tool: pads, keys or chord buttons play scale, set or custom chords with voicing, strum, arp and harp modes, MIDI out to other tracks and a built-in preview synth."
      plugin_id: chordsmith
      license: MIT
      dry_run: ${{ inputs.dry_run }}
