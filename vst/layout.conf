# Chordsmith skin. Theme: deep indigo panel, teal for chords, neon pink for what's sounding and the titles,
# neon purple for frames, selections and knob rings.
# Five tabs: with more MPC folds the tab strip into pages. PLAY FROM (what plays the chords) and the output
# line (where they go) are on the first tab, so a new user sees both before anything else.
# One Q-Link bank (4 controls) per tab: MPC Key 37 has 4 physical Q-Links and its Q-Link sub-pages
# don't cycle, so a second bank would be unreachable there (see mpc-vst-nam's layout.conf).
# Q-Links only get knob-safe controls: nothing that plays, clears or retunes on a turn.
style=td3
art_css=skin.css
label_scale=1.3
scale_names=1
theme_bg=120d24
theme_box=1a1433
theme_ink=f3ecff
theme_ink_dim=b9a3e0
theme_ink_faint=3d2a63
theme_accent=2ad4c0
theme_accent_hi=ff2bd6
theme_seg_active=a64dff
theme_seg_inactive=2a1f4a
theme_seg_active_tx=ffffff
theme_lcd=0d0a1c
theme_line=6a35c9
theme_btn_bg=ff2bd6
theme_btn_text=120d24
theme_display_ink=2ad4c0
theme_panel=211843
theme_knob_face=221a40
theme_knob_ring=a64dff
theme_knob_dot=ff2bd6
theme_tab_on=ff2bd6
theme_tab_on_tx=120d24
theme_chrome_ink=f3ecff
theme_bar=231a45
theme_tile_on=5a1452

[tab PLAY]
# Pads 1-8 (or white keys C-B with PLAY FROM = KEYS) play the eight chords; tap a tile to hear one.
# The bottom line says what just played and the output line where it went (preview synth, MIDI port, both).
frame x=40 y=112 w=1200 h=128 title="PLAY FROM"
enum_h cx=300 cy=206 sw=150 label="PLAY FROM" key=input options="PADS,KEYS,BUTTONS"
toggle cx=640 cy=186 label="PREVIEW SYNTH" key=sound
popup cx=850 cy=206 w=200 h=48 label="KEY" key=key
popup cx=1090 cy=206 w=260 h=48 label="SCALE" key=scale
# CHORDS FROM = CUSTOM: eight chords of your own. A tile tap (or the EDIT stepper) picks the pad, ROOT and
# CHORD set it, COPY takes the chords SCALE or SET last showed as a starting point.
frame x=40 y=252 w=1200 h=128 title="CHORDS FROM"
enum_h cx=300 cy=346 sw=130 label="CHORDS FROM" key=source options="SCALE,SET,CUSTOM"
enum_h cx=880 cy=346 sw=120 label="CHORD TYPE" key=extension options="TRIAD,7TH,9TH,SUS2,SUS4" when=source:scale
stepper cx=880 cy=346 w=600 h=56 label="CHORD SET" key=set get=set_name when=source:set
stepper cx=600 cy=346 w=190 h=44 label="EDIT" key=edit get=edit_name when=source:custom
stepper cx=785 cy=346 w=160 h=44 label="ROOT" key=edit_root get=edit_root_name when=source:custom
stepper cx=995 cy=346 w=240 h=44 label="CHORD" key=edit_qual get=edit_qual_name when=source:custom
button cx=1180 cy=346 label="COPY" key=copy when=source:custom
# the tiles sit like the pad bank: pads 1-4 along the bottom, 5-8 above; a sounding chord's tile lights
frame x=40 y=392 w=1200 h=232 title="CHORDS"
list x=64 y=428 w=1152 h=182 cols=4 rows=2 th=84 gap=14 key=slot order=pads
readout cx=640 cy=646 w=1200 h=36 key=trail
readout cx=360 cy=690 w=640 h=40 key=chord
readout cx=970 cy=690 w=540 h=40 key=output
qlinks "PLAY" = key,scale,source,set

[tab VOICE]
frame x=40 y=112 w=1200 h=250 title="VOICING"
enum_h cx=330 cy=200 sw=130 label="SHAPE" key=voicing options="CLOSE,DROP 2,DROP 3,SPREAD"
enum_h cx=950 cy=200 sw=120 label="INVERSION" key=inversion options="ROOT,1ST,2ND,3RD"
enum_h cx=330 cy=300 sw=100 label="OCTAVE" key=octave options="-2,-1,0,+1,+2"
toggle cx=800 cy=300 label="VOICE LEAD" key=voice_lead
toggle cx=1060 cy=300 label="BASS NOTE" key=bass
frame x=40 y=378 w=1200 h=300 title="STRUM / VELOCITY"
knob cx=200 cy=520 r=54 label="STRUM" key=strum
enum_h cx=470 cy=520 sw=110 label="STRUM DIR" key=strum_dir options="UP,DOWN"
enum_h cx=820 cy=520 sw=130 label="VELOCITY" key=vel_mode options="PLAYED,FIXED"
knob cx=1110 cy=520 r=54 label="FIXED VEL" key=velocity
qlinks "VOICE" = voicing,inversion,octave,strum

[tab BUTTONS]
# PLAY FROM = BUTTONS: hold a chord type and extensions, play a root. With PAD BUTTONS on, pads 1-4 are 6, m7,
# maj7, 9 and pads 5-8 DIM, MIN, MAJ, SUS4 (held, they override the screen), pads 9-16 the roots I-vii and
# I up an octave of KEY/SCALE. Every key plays the chord on its own root. AUTO = the chord the key gives it.
# The hint line says so, or that PLAY FROM is not on BUTTONS yet.
frame x=40 y=112 w=1200 h=128 title="PLAY FROM"
enum_h cx=300 cy=206 sw=150 label="PLAY FROM" key=input options="PADS,KEYS,BUTTONS"
readout cx=880 cy=206 w=640 h=48 key=buttons_hint
frame x=40 y=252 w=1200 h=112 title="CHORD TYPE"
enum_h cx=640 cy=322 sw=200 label="" key=chord_type options="AUTO,DIM,MIN,MAJ,SUS4"
frame x=40 y=376 w=1200 h=136 title="EXTENSIONS"
toggle cx=200 cy=450 label="ADD 6" key=ext_6
toggle cx=480 cy=450 label="ADD m7" key=ext_m7
toggle cx=760 cy=450 label="ADD maj7" key=ext_maj7
toggle cx=1040 cy=450 label="ADD 9" key=ext_9
frame x=40 y=524 w=1200 h=124 title="PAD BUTTONS / LATCH"
toggle cx=400 cy=590 label="PAD BUTTONS" key=pad_buttons
toggle cx=880 cy=590 label="LATCH" key=latch
readout cx=360 cy=690 w=640 h=40 key=chord
readout cx=970 cy=690 w=540 h=40 key=output
qlinks "BUTTONS" = chord_type,voice_dial,perform,rate

[tab PERFORM]
# How a chord is played, in time with the project tempo: all at once, loose (SLOP), arpeggiated, strummed
# across four octaves (HARP) or in a rhythm (PATTERN 1-3). LATCH keeps it going after the key is let go.
frame x=40 y=112 w=1200 h=150 title="PERFORM"
popup cx=250 cy=206 w=340 h=48 label="MODE" key=perform
enum_h cx=830 cy=206 sw=100 label="RATE" key=rate options="1/4,1/8,1/8T,1/16,1/16T,1/32"
frame x=40 y=276 w=1200 h=224 title="VOICING DIAL"
knob cx=200 cy=376 r=54 label="VOICING" key=voice_dial
text cx=330 cy=360 size=2.0 align=left label="UP: THE LOWEST NOTE GOES UP AN OCTAVE. DOWN: THE TOP NOTE DOWN."
text cx=330 cy=404 size=2.0 align=left label="WALKS THE CHORD THROUGH ITS INVERSIONS. THE BASS NOTE STAYS."
frame x=40 y=512 w=1200 h=150 title="BASS / LATCH"
stepper cx=330 cy=604 w=420 h=56 label="BASS CHANNEL" key=bass_ch get=bass_ch_name
toggle cx=820 cy=604 label="BASS NOTE" key=bass
toggle cx=1080 cy=604 label="LATCH" key=latch
readout cx=640 cy=690 w=1200 h=36 key=chord
qlinks "PERFORM" = perform,rate,voice_dial,strum

[tab SETUP]
# INPUT: what plays the chords and how the pads and keys map. PLAY FROM = KEYS uses the MPC's keybed or any
# MIDI keyboard on the track (pads-only MPCs leave it on PADS): WHITE KEYS = C-B play chords 1-7, black keys
# the chord to their left with more colour; SCALE NOTES = every key plays the chord built on it. SPLIT: keys
# from SPLIT POINT up pass through as single notes.
# MIDI OUT: the chords leave through the ALSA port "Chordsmith MIDI Out": enable it in Preferences > MIDI
# (Track), then pick it as the MIDI input of the track that should play them. PREVIEW SYNTH plays them here
# too, on a small built-in synth, to try things without routing the port.
frame x=40 y=112 w=1200 h=220 title="INPUT"
enum_h cx=300 cy=196 sw=150 label="PLAY FROM" key=input options="PADS,KEYS,BUTTONS"
stepper cx=920 cy=196 w=420 h=56 label="PAD 1 NOTE" key=pad_base
enum_h cx=300 cy=290 sw=150 label="KEY MAP" key=key_map options="WHITE KEYS,SCALE NOTES"
toggle cx=600 cy=272 label="SPLIT" key=split
stepper cx=920 cy=290 w=420 h=56 label="SPLIT POINT" key=split_note get=split_name
frame x=40 y=344 w=1200 h=130 title="MIDI OUT"
stepper cx=330 cy=438 w=420 h=56 label="MIDI CHANNEL" key=channel
readout cx=720 cy=438 w=320 h=48 key=status
button cx=1080 cy=438 label="ALL NOTES OFF" key=panic
frame x=40 y=486 w=1200 h=210 title="PREVIEW SYNTH"
toggle cx=200 cy=590 label="PREVIEW SYNTH" key=sound
knob cx=560 cy=580 r=44 label="LEVEL" key=synth_level
text cx=760 cy=570 size=2.0 align=left label="ON: THIS TRACK PLAYS THE CHORDS TOO."
text cx=760 cy=610 size=2.0 align=left label="OFF: ONLY THE MIDI OUT PORT DOES."
qlinks "SETUP" = sound,synth_level,pad_base,channel
